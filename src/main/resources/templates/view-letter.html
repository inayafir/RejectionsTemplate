<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Letter - CHSS Portal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <th:block th:replace="~{fragments :: toast}"></th:block>

        <main class="main-content">

            <div class="card">
                <div class="card-body" style="padding: 0;">
                    <div class="pdf-viewer" style="width: 100%; height: 75vh;">
                        <iframe th:src="@{/print/{id}(id=${letter.letterId})}" style="width: 100%; height: 100%; border: none;" frameborder="0"></iframe>
                    </div>
                </div>
                <div class="actions-bar">
                    <a th:href="@{/download/{id}(id=${letter.letterId})}" class="btn btn-yellow">
                        Download PDF
                    </a>
                    <a th:href="@{/print/{id}(id=${letter.letterId})}" class="btn btn-secondary" target="_blank">
                        Print
                    </a>
                    <a th:href="@{/edit/{id}(id=${letter.letterId})}" class="btn btn-secondary">
                        Edit
                    </a>
                    <form method="post" th:action="@{/regenerate/{id}(id=${letter.letterId})}" style="display:inline;">
                        <button type="submit" class="btn btn-secondary">
                            Regenerate
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
