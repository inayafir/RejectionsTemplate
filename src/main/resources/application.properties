# ============================================================
# CHSS Rejection Letter Generator - Application Configuration
# ============================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# -------------------------------------------
# Active Profile: dev (H2) or prod (MySQL)
# Change to "prod" when MySQL is configured
# -------------------------------------------
spring.profiles.active=dev

# -------------------------------------------
# Thymeleaf
# -------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Generated letters storage path
app.letters.storage-path=./generated_letters

# SQLite database path (for initial migration)
app.sqlite.db-path=./staff_directory.db

# Rejections JSON path
app.rejections.json-path=./Rejections.json

# Static resources
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------
# H2 Database Configuration (dev profile)
# -------------------------------------------
spring.datasource.url=jdbc:h2:mem:chss_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

